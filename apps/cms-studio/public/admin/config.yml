backend:
  name: github
  repo: blackscythe123/CC-Website-2026
  branch: main
  auth_endpoint: api/auth

# EDITORIAL APPROVAL WORKFLOW:
# Enables Draft -> In Review -> Ready to Publish pipeline!
# When a club member creates a post, Decap CMS creates a Git branch & Pull Request.
# When the Vertical Head approves and clicks "Publish", Decap merges the PR into main!
publish_mode: editorial_workflow

# Local development fallback
local_backend: false

media_folder: apps/main-portal/public/uploads
public_folder: /uploads

site_url: https://ssn-coding-club-cms.vercel.app
display_url: https://ssn-coding-club.vercel.app

collections:
  - name: club_posts
    label: "📢 Coding Club Announcements"
    folder: content/club/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Coding Club Core" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", default: ["Club", "Announcement"] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: ai_ml
    label: "🤖 1. AI & Machine Learning"
