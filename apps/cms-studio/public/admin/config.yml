backend:
  name: github
  repo: blackscythe123/CC-Website-2026
  branch: main
  base_url: https://ssn-coding-club-cms.vercel.app
  auth_endpoint: api/auth

# Editorial Approval Workflow
publish_mode: editorial_workflow

local_backend: false

media_folder: apps/main-portal/public/uploads
public_folder: /uploads

site_url: https://ssn-coding-club-cms.vercel.app
display_url: https://ssn-coding-club-wine.vercel.app

collections:
  - name: club_posts
    label: "📢 Coding Club Announcements"
    folder: content/club/posts
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Coding Club Core" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["Club", "Announcement"] }
      - label: "Body (Drag & drop images anywhere mid-post)"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        buttons: ["bold", "italic", "code", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list", "image"]
        editor_components: ["image", "code-block"]

  - name: ai_ml
