<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Club Central CMS Studio</title>
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #374151;
        text-align: center;
        padding: 20px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <h2>Loading Apex Club CMS Studio...</h2>
      <p>Decentralized multi-vertical editorial workflow with Git approvals.</p>
    </div>

    <!-- Official Decap CMS CDN -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
          var loader = document.getElementById("loader");
          if (loader && window.CMS) {
            loader.style.display = "none";
          }
        }, 1200);
      });
    </script>
  </body>
</html>
