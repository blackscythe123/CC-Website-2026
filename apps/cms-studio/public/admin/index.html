<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSN Coding Club CMS Studio</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #374151;
        text-align: center;
        padding: 20px;
      }
      .spinner {
        width: 44px;
        height: 44px;
        border: 4px solid #e5e7eb;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!-- js-yaml to parse config.yml dynamically -->
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <h2>Loading SSN Coding Club CMS Studio...</h2>
      <p>Decentralized multi-vertical editorial workflow with Git approvals.</p>
    </div>

    <script>
      // Instruct Decap CMS to wait for our dynamic configuration
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      fetch('/admin/config.yml')
        .then(function(res) { return res.text(); })
        .then(function(yamlText) {
          var config = jsyaml.load(yamlText);
          // Dynamically route OAuth to the current domain (e.g. Vercel or custom domain)
          config.backend = config.backend || {};
          config.backend.base_url = window.location.origin;
          config.backend.auth_endpoint = "api/auth";

          window.CMS.init({ config: config });

          var loader = document.getElementById("loader");
          if (loader) {
            loader.style.display = "none";
          }
        })
        .catch(function(err) {
          console.error("Failed to load /admin/config.yml:", err);
          var loader = document.getElementById("loader");
          if (loader) {
            loader.innerHTML = "<h3 style='color:red;'>Failed to load CMS configuration</h3><p>" + err.message + "</p>";
          }
        });
    </script>
  </body>
</html>
