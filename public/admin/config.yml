backend:
  name: github
  repo: your-username/coding-club-cms # REPLACE with your GitHub user/org and repo name
  branch: main
  auth_endpoint: api/auth

# local_backend allows local testing with `pnpm cms` (no GitHub OAuth needed during local testing)
local_backend: true

# Media files location
media_folder: public/images/uploads
public_folder: /images/uploads

# Display options in CMS UI
site_url: https://coding-club-cms.vercel.app
display_url: https://coding-club-cms.vercel.app
logo_url: /globe.svg

collections:
  - name: posts
    label: Blog Posts
    folder: content/posts
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Coding Club Member" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["Tech", "Announcement"] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: events
    label: Events & Workshops
    folder: content/events
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Event Title", name: "title", widget: "string" }
      - { label: "Date & Time", name: "date", widget: "datetime" }
      - { label: "Location", name: "location", widget: "string", default: "Campus Auditorium / Discord" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Registration Link", name: "registrationUrl", widget: "string", required: false }
      - { label: "Details", name: "body", widget: "markdown" }

  - name: settings
    label: Settings
    files:
      - label: "Club Information"
        name: "club_info"
        file: "content/settings/club.json"
        fields:
          - { label: "Club Name", name: "clubName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "GitHub URL", name: "githubUrl", widget: "string" }
          - { label: "Discord URL", name: "discordUrl", widget: "string" }
