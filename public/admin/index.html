<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Club CMS | Content Studio</title>
    <link rel="icon" href="/globe.svg" />
    <!-- Link to Decap CMS config file -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #loading-notice {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #4b5563;
        text-align: center;
        padding: 20px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Fallback loader while Decap CMS script initializes -->
    <div id="loading-notice">
      <div class="spinner"></div>
      <h2>Loading Coding Club CMS...</h2>
      <p>Empowering non-technical members to publish content directly to Git.</p>
    </div>

    <!-- Decap CMS official script -->
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      // Hide the loader once Decap CMS takes over
      window.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
          var loader = document.getElementById("loading-notice");
          if (loader && window.CMS) {
            loader.style.display = "none";
          }
        }, 1200);
      });
    </script>
  </body>
</html>
